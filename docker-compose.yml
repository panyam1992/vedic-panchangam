version: '3.8'

services:
  vedic-panchangam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vedic_samhita_panchangam
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
